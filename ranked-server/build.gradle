// spd-ranked (A1): the ranked Duel server. Plain JVM, no libGDX backend; it only uses
// core for the shared match rules (ranked/duel) and seed pool format (ranked/seed).
apply plugin: 'java'
apply plugin: 'application'

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
java.sourceCompatibility = java.targetCompatibility = appJavaCompatibility

application {
    mainClass = 'com.shatteredpixel.shatteredpixeldungeon.ranked.server.ServerMain'
}

dependencies {
    implementation project(':core')
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'org.xerial:sqlite-jdbc:3.46.1.3'

    testImplementation 'org.json:json:20170516'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging { events 'failed', 'skipped'; exceptionFormat 'full' }
}
