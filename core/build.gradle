apply plugin: 'java-library'

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
java.sourceCompatibility = java.targetCompatibility = appJavaCompatibility

dependencies {
    api project(':SPD-classes')
    implementation project(':services')
    // spd-ranked (A1 client): frame JSON; same artifact SPD-classes already ships
    implementation "org.json:json:20170516"

    // spd-ranked: headless test harness (T0.3/T0.4)
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "org.json:json:20170516"
    testImplementation "com.badlogicgames.gdx:gdx-backend-headless:$gdxVersion"
    testImplementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    testImplementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    testImplementation "org.ow2.asm:asm:9.9"
}

// spd-ranked: tests run headless with the game's assets as working directory
tasks.named('test') {
    useJUnitPlatform()
    workingDir = file('src/main/assets')
    maxHeapSize = '2g'
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
        showStandardStreams = true
    }
    systemProperty 'spdr.test.out', layout.buildDirectory.dir('spdr').get().asFile.absolutePath
    // regenerate golden digests: -Dspdr.golden.update=<path> (see GoldenDigestTest)
    if (System.getProperty('spdr.golden.update') != null) {
        systemProperty 'spdr.golden.update', rootProject.file(System.getProperty('spdr.golden.update')).absolutePath
        outputs.upToDateWhen { false }
    }
}

// spd-ranked: determinism tests (tag "determinism") are part of the default test run since T0.8.
// determinismTest stays as a shortcut to run only them.
tasks.register('determinismTest', Test) {
    description = 'Runs only the determinism tests (tag "determinism").'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'determinism' }
    workingDir = file('src/main/assets')
    maxHeapSize = '2g'
    testLogging { events 'passed', 'failed', 'skipped'; exceptionFormat 'full' }
}

// spd-ranked (A1): build fingerprint = SHA-256 over core's compiled classes (sorted path + bytes).
// Replay (A3) only holds on the same bytecode, so client and server compare this, not the version.
// Written as a resource: the game reads it from its core jar, the server from the same jar.
def rankedFingerprintDir = layout.buildDirectory.dir('generated/ranked-fingerprint')
tasks.register('rankedFingerprint') {
    description = 'Hashes compiled core classes into ranked/build-fingerprint.txt.'
    def classes = sourceSets.main.output.classesDirs
    inputs.files(classes).withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.dir(rankedFingerprintDir)
    dependsOn tasks.named('compileJava')
    doLast {
        def md = java.security.MessageDigest.getInstance('SHA-256')
        def files = []
        classes.each { root ->
            if (root.exists()) root.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                files << [root.toPath().relativize(f.toPath()).toString().replace(File.separatorChar, (char) '/'), f]
            }
        }
        files.sort { it[0] }.each { entry ->
            md.update(entry[0].getBytes('UTF-8'))
            md.update((byte) 0)
            md.update(entry[1].bytes)
        }
        def out = rankedFingerprintDir.get().file('ranked/build-fingerprint.txt').asFile
        out.parentFile.mkdirs()
        out.text = 'spdr-' + md.digest().encodeHex().toString().substring(0, 16) + '\n'
    }
}
sourceSets.main.resources.srcDir(rankedFingerprintDir)
tasks.named('processResources') { dependsOn 'rankedFingerprint' }
