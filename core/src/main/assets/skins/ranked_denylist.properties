# spd-ranked (A6): parts of the art a skin pack may not replace in Ranked, because a different
# picture there would tell one player something the other cannot see.
# Paths are asset paths as in Assets.java. A pack may still change them in Solo.

# whole files: animated statues vs plain statues, weak floor
deny.atlas=sprites/statue.png,environment/custom_tiles/weak_floor.png

# rectangles x,y,w,h separated by ';'
# mimic.png: the three hiding frames (0,1,2) of each of the four mimic kinds (rows of 16px)
deny.rects.sprites/mimic.png=0,0,48,16;0,16,48,16;0,32,48,16;0,48,48,16
# items.png: chest, locked chest, crystal chest, ebony chest, which a mimic copies
deny.rects.sprites/items.png=64,32,16,14;80,32,16,14;96,32,16,14;112,32,16,14
