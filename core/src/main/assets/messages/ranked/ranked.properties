###C4 wiki: tips shown after SPD's own text on an open journal page (draft, to be reviewed)
ranked.qol.wiki.tip_label=Tip:
ranked.qol.wiki.tip.rat=Weak alone, dangerous in groups. Fight in a corridor so only one can reach you.
ranked.qol.wiki.tip.albino=Its bite makes you bleed. Kill it quickly rather than trading blows.
ranked.qol.wiki.tip.snake=Hard to hit with normal attacks. Wait beside a doorway and strike right after it steps into the door: that is a surprise attack.
ranked.qol.wiki.tip.gnoll=An ordinary fighter that often drops gold.
ranked.qol.wiki.tip.crab=It moves twice as fast as you, so running away rarely works. Fight it where you stand, or near a door.
ranked.qol.wiki.tip.slime=No single hit does more than 6 damage to it, so a strong weapon is wasted here. Many small hits work just as well.
ranked.qol.wiki.tip.swarm=Every non-magical hit splits it. Fight in a corridor so the copies line up, or use magic.
ranked.qol.wiki.tip.goo=When Goo pumps up, get more than 2 tiles away or out of its line of fire: the next hit does triple damage. Goo heals while standing in water, so fight it on dry floor.
ranked.qol.wiki.tip.skeleton=It explodes into bone shrapnel when it dies. Armor reduces that damage a lot.
ranked.qol.wiki.tip.thief=It steals an item and runs. Keep it in sight: killing it drops what it took.
ranked.qol.wiki.tip.bandit=Like a thief, but its hit also blinds, cripples and poisons. Deal with it first.
ranked.qol.wiki.tip.necromancer=Killing the necromancer also kills the skeleton it summoned, so go for the necromancer.
ranked.qol.wiki.tip.guard=It can pull you next to it with its chain, so keeping your distance does not always work.
ranked.qol.wiki.tip.dm100=It shocks you from range. Break line of sight around a corner so it has to come close.
ranked.qol.wiki.tip.redshaman=Its bolt weakens you. Break line of sight and make it come to you.
ranked.qol.wiki.tip.blueshaman=Its bolt makes you vulnerable to damage. Break line of sight and make it come to you.
ranked.qol.wiki.tip.purpleshaman=Its bolt hexes you. Break line of sight and make it come to you.
ranked.qol.wiki.tip.tengu=He jumps away when hurt. In the second half of the fight he throws bombs, fire and shocking traps: keep moving and do not stand where he aims.
ranked.qol.wiki.tip.bat=It heals with every hit it lands. A long fight favours the bat; hit hard and fast.
ranked.qol.wiki.tip.brute=When nearly dead it goes berserk with a shield and big damage. Step back or finish it in one burst.
ranked.qol.wiki.tip.spinner=It keeps its distance, webs your path and poisons with its bite. Close in fast or fight it from a corridor.
ranked.qol.wiki.tip.dm200=It is too big for doors and narrow tunnels, but its toxic exhaust is not. Do not stand in the gas.
ranked.qol.wiki.tip.dm300=While supercharged it cannot be hurt. Find the active pylon and destroy it.
ranked.qol.wiki.tip.potionofhealing=Heals quickly and cures most harmful effects, such as poison and bleeding. Keep one for emergencies.
ranked.qol.wiki.tip.potionofstrength=Raises strength for good. Drink it right away: heavy weapons and armor need strength.
ranked.qol.wiki.tip.potionofexperience=Gives a full level.
ranked.qol.wiki.tip.potionofmindvision=Shows the creatures on the floor for a while. Good for planning a route or finding a thief.
ranked.qol.wiki.tip.potionofhaste=Lets you move much faster for a while. A strong escape.
ranked.qol.wiki.tip.potionofinvisibility=Enemies lose track of you. Attacking ends it, but that first attack is a surprise attack.
ranked.qol.wiki.tip.potionoflevitation=Float over chasms, water and traps for a while.
ranked.qol.wiki.tip.potionofpurity=Clears gas around you and protects you from gases for a while.
ranked.qol.wiki.tip.potionofliquidflame=Throw it at enemies. Keep away from grass near you; water stops fire.
ranked.qol.wiki.tip.potionoftoxicgas=Throw it into a room of enemies and step back: the gas spreads.
ranked.qol.wiki.tip.potionofparalyticgas=Paralyzes everything in the cloud, you included. Throw it far.
ranked.qol.wiki.tip.potionoffrost=Throw it to freeze enemies in place. It also puts out fire.
ranked.qol.wiki.tip.scrollofupgrade=The most valuable scroll. Putting most of them into one or two items usually wins more runs than spreading them.
ranked.qol.wiki.tip.scrollofidentify=Use it on an item you are about to rely on, such as a ring or wand you want to upgrade.
ranked.qol.wiki.tip.scrollofremovecurse=Lifts curses from an item you choose. Unknown equipment can be cursed, so keep one at hand.
ranked.qol.wiki.tip.scrollofmirrorimage=Creates images of you that fight and draw attention.
ranked.qol.wiki.tip.scrollofrecharging=Recharges your wands at once. Read it when your wands are empty.
ranked.qol.wiki.tip.scrollofteleportation=Moves you elsewhere on the floor. A reliable escape.
ranked.qol.wiki.tip.scrolloflullaby=Puts nearby enemies to sleep. Sleeping enemies take surprise attacks.
ranked.qol.wiki.tip.scrollofmagicmapping=Reveals the layout of the floor, secret doors included.
ranked.qol.wiki.tip.scrollofrage=Draws enemies to you and makes nearby ones fight each other. Read it when crowded, not when weak.
ranked.qol.wiki.tip.scrollofretribution=Hurts and blinds the enemies you can see, more the lower your health is.
ranked.qol.wiki.tip.scrollofterror=Makes nearby enemies flee.
ranked.qol.wiki.tip.scrolloftransmutation=Turns an item into another of the same kind. Good for an item you will never use.

