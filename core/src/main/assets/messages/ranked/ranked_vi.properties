ranked.replay.replayviewer.details=Nhân vật: %1$s\nChế độ: %2$s\nSeed: %3$d\nSố lệnh: %4$d\n\nXem lại không thay đổi game hay hồ sơ của bạn. Thao tác của bạn chỉ tác động lên thanh điều khiển replay.
ranked.replay.replayviewer.other_version=Ghi bằng phiên bản game %1$d, bản này là %2$d. Replay có thể dừng ở chỗ game chạy khác đi.
ranked.replay.replayviewer.solo_warning=Không phải replay Ranked: chỉ chạy giống hệt nếu hồ sơ và cài đặt của bạn giống lúc ghi.
