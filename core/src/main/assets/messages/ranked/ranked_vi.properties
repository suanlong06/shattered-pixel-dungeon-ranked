###C4 wiki: mẹo hiện sau mô tả gốc của SPD trên trang nhật ký đã mở (bản nháp, cần duyệt)
ranked.qol.wiki.tip_label=Mẹo:
ranked.qol.wiki.tip.rat=Một con thì yếu, cả đàn thì nguy hiểm. Đánh trong hành lang để mỗi lần chỉ một con tới được bạn.
ranked.qol.wiki.tip.albino=Vết cắn gây chảy máu. Hạ nhanh thay vì đứng đổi đòn.
ranked.qol.wiki.tip.snake=Khó đánh trúng bằng đòn thường. Đứng cạnh cửa và đánh ngay khi nó bước vào ô cửa: đó là đòn bất ngờ.
ranked.qol.wiki.tip.gnoll=Kẻ địch bình thường, hay rơi vàng.
ranked.qol.wiki.tip.crab=Nó đi nhanh gấp đôi bạn nên bỏ chạy hiếm khi được. Đánh tại chỗ hoặc gần cửa.
ranked.qol.wiki.tip.slime=Mỗi đòn gây tối đa 6 sát thương lên nó, vũ khí mạnh bị phí. Nhiều đòn nhỏ cũng hiệu quả như vậy.
ranked.qol.wiki.tip.swarm=Mỗi đòn không phải phép thuật làm nó tách đôi. Đánh trong hành lang để các bản sao xếp hàng, hoặc dùng phép.
ranked.qol.wiki.tip.goo=Khi Goo phồng lên, hãy ra xa hơn 2 ô hoặc ra khỏi đường bắn của nó: đòn kế tiếp gây sát thương gấp ba. Goo hồi máu khi đứng trong nước, nên đánh nó trên sàn khô.
ranked.qol.wiki.tip.skeleton=Khi chết nó nổ ra mảnh xương. Giáp giảm sát thương này rất nhiều.
ranked.qol.wiki.tip.thief=Nó trộm một món đồ rồi bỏ chạy. Giữ nó trong tầm nhìn: hạ nó sẽ rơi lại món đồ.
ranked.qol.wiki.tip.bandit=Giống kẻ trộm nhưng đòn đánh còn gây mù, què và trúng độc. Xử lý nó trước.
ranked.qol.wiki.tip.necromancer=Hạ pháp sư gọi hồn cũng hạ luôn bộ xương nó triệu hồi, nên nhắm vào pháp sư.
ranked.qol.wiki.tip.guard=Nó có thể kéo bạn lại gần bằng xích, nên giữ khoảng cách không phải lúc nào cũng được.
ranked.qol.wiki.tip.dm100=Nó giật điện từ xa. Nấp sau góc tường để nó phải lại gần.
ranked.qol.wiki.tip.redshaman=Tia phép của nó làm bạn yếu đi. Cắt tầm nhìn và để nó tự đến gần.
ranked.qol.wiki.tip.blueshaman=Tia phép của nó làm bạn dễ bị sát thương hơn. Cắt tầm nhìn và để nó tự đến gần.
ranked.qol.wiki.tip.purpleshaman=Tia phép của nó yểm bùa (hex) lên bạn. Cắt tầm nhìn và để nó tự đến gần.
ranked.qol.wiki.tip.tengu=Hắn nhảy đi khi bị thương. Ở nửa sau trận hắn ném bom, lửa và bẫy điện: luôn di chuyển và đừng đứng chỗ hắn nhắm.
ranked.qol.wiki.tip.bat=Mỗi đòn trúng nó lại hồi máu. Trận càng dài càng có lợi cho dơi; đánh mạnh và nhanh.
ranked.qol.wiki.tip.brute=Khi gần chết nó nổi điên, có khiên và đánh rất đau. Lùi lại hoặc kết liễu trong một loạt đòn.
ranked.qol.wiki.tip.spinner=Nó giữ khoảng cách, giăng tơ chặn đường và cắn gây độc. Áp sát nhanh hoặc đánh từ hành lang.
ranked.qol.wiki.tip.dm200=Nó quá to để qua cửa và đường hầm hẹp, nhưng khí độc nó xả ra thì qua được. Đừng đứng trong khí.
ranked.qol.wiki.tip.dm300=Khi đang siêu nạp nó không thể bị thương. Tìm cột điện đang hoạt động và phá nó.
ranked.qol.wiki.tip.potionofhealing=Hồi máu nhanh và chữa hầu hết hiệu ứng xấu như độc, chảy máu. Giữ một bình cho lúc nguy cấp.
ranked.qol.wiki.tip.potionofstrength=Tăng sức mạnh vĩnh viễn. Uống ngay: vũ khí và giáp nặng cần sức mạnh.
ranked.qol.wiki.tip.potionofexperience=Cho thêm trọn một cấp.
ranked.qol.wiki.tip.potionofmindvision=Hiện các sinh vật trên tầng trong một lúc. Hữu ích để tính đường đi hoặc tìm kẻ trộm.
ranked.qol.wiki.tip.potionofhaste=Di chuyển nhanh hơn nhiều trong một lúc. Cách thoát thân tốt.
ranked.qol.wiki.tip.potionofinvisibility=Kẻ địch mất dấu bạn. Tấn công sẽ kết thúc hiệu ứng, nhưng đòn đầu tiên là đòn bất ngờ.
ranked.qol.wiki.tip.potionoflevitation=Bay qua vực, nước và bẫy trong một lúc.
ranked.qol.wiki.tip.potionofpurity=Xóa khí quanh bạn và bảo vệ bạn khỏi các loại khí trong một lúc.
ranked.qol.wiki.tip.potionofliquidflame=Ném vào kẻ địch. Tránh xa cỏ gần mình; nước chặn lửa.
ranked.qol.wiki.tip.potionoftoxicgas=Ném vào phòng có kẻ địch rồi lùi lại: khí sẽ lan ra.
ranked.qol.wiki.tip.potionofparalyticgas=Làm tê liệt mọi thứ trong đám khí, kể cả bạn. Ném thật xa.
ranked.qol.wiki.tip.potionoffrost=Ném để đóng băng kẻ địch tại chỗ. Cũng dập được lửa.
ranked.qol.wiki.tip.scrollofupgrade=Cuộn giấy quý nhất. Dồn phần lớn vào một hoặc hai món thường thắng nhiều hơn là rải đều.
ranked.qol.wiki.tip.scrollofidentify=Dùng cho món bạn sắp dựa vào, như nhẫn hay đũa định nâng cấp.
ranked.qol.wiki.tip.scrollofremovecurse=Giải lời nguyền khỏi món đồ bạn chọn. Trang bị chưa rõ có thể bị nguyền, nên giữ sẵn một cuộn.
ranked.qol.wiki.tip.scrollofmirrorimage=Tạo các bản sao của bạn để đánh và thu hút kẻ địch.
ranked.qol.wiki.tip.scrollofrecharging=Nạp lại đũa phép ngay lập tức. Đọc khi đũa đã hết lượt.
ranked.qol.wiki.tip.scrollofteleportation=Đưa bạn tới chỗ khác trên tầng. Cách thoát thân chắc chắn.
ranked.qol.wiki.tip.scrolloflullaby=Ru ngủ kẻ địch gần đó. Kẻ địch đang ngủ sẽ dính đòn bất ngờ.
ranked.qol.wiki.tip.scrollofmagicmapping=Hiện bản đồ tầng, kể cả cửa bí mật.
ranked.qol.wiki.tip.scrollofrage=Kéo kẻ địch về phía bạn và khiến những con gần đó đánh nhau. Đọc khi bị vây, đừng đọc khi đang yếu.
ranked.qol.wiki.tip.scrollofretribution=Gây sát thương và làm mù kẻ địch trong tầm nhìn, máu bạn càng thấp càng mạnh.
ranked.qol.wiki.tip.scrollofterror=Khiến kẻ địch gần đó bỏ chạy.
ranked.qol.wiki.tip.scrolloftransmutation=Biến một món đồ thành món khác cùng loại. Hợp với món bạn sẽ không bao giờ dùng.

