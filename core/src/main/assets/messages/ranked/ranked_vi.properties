ranked.replay.replayviewer.list_desc=Các trận Ranked bạn đã đấu được lưu ở đây khi có kết quả. Bạn cũng có thể chép tệp replay vào thư mục replays. Trang %1$d/%2$d.
ranked.replay.replayviewer.none=Chưa có replay nào. Trận Ranked được lưu ở đây khi kết thúc; bạn cũng có thể chép tệp replay vào thư mục "%s".
