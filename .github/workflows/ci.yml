name: CI

on:
  push:
    branches: [ master, 'feature/**', 'claude/**' ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (headless)
        run: ./gradlew :core:test --stacktrace
      - name: Desktop release jar
        run: ./gradlew :desktop:release
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: core/build/reports/tests/

  # Determinism spikes (T0.6). Expected to fail on unmodified SPD until T0.8: visible, not blocking.
  determinism:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Determinism spike tests
        run: ./gradlew :core:determinismTest
