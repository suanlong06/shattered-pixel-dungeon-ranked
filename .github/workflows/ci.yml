name: CI

on:
  push:
    branches: [ master, 'feature/**', 'claude/**' ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # includes the determinism tests (replay, frame rate, child JVM, save/load), the lint and the golden digests (T0.8)
      - name: Unit tests (headless)
        run: ./gradlew :core:test --stacktrace
      - name: Desktop release jar
        run: ./gradlew :desktop:release
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: core/build/reports/tests/
